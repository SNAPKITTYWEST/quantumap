[package]
name = "sovereign-ledger"
version = "0.1.0"
edition = "2024"
authors = ["Ahmad Ali Parr", "Jessica L. Williams (SNAPKITTYWEST)"]
description = "Borrowchain Token Ledger & WORM Block Header — CompCert Target Runtime"
license = "AGPL-3.0-or-later"

[dependencies]
zeroize = { version = "1.8", features = ["derive"] }

[features]
default = []
std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
